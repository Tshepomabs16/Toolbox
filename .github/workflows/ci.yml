name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 supports JDK 17-21. Do not bump past 21 without also bumping AGP.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release is assembled too, not just debug: release is what ships, and the
      # hard-rule check below needs the release merged manifest to exist.
      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Hard rule — no INTERNET permission
        run: ./scripts/check-no-internet.sh
