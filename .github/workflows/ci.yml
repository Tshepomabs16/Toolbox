name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Check for INTERNET permission
        run: |
          MERGED_MANIFEST=$(find app/build -name "AndroidManifest.xml" -path "*/merged/*" | head -1)
          if [ -f "$MERGED_MANIFEST" ]; then
            if grep -q "android.permission.INTERNET" "$MERGED_MANIFEST"; then
              echo "ERROR: INTERNET permission found in merged manifest!"
              echo "This violates the hard rule: no data leaves the device."
              exit 1
            fi
            echo "PASS: No INTERNET permission in merged manifest."
          else
            echo "WARNING: Merged manifest not found. Build first, then check."
          fi

      - name: Verify no INTERNET permission in source
        run: |
          if grep -r "android.permission.INTERNET" app/src/main; then
            echo "ERROR: INTERNET permission found in source!"
            exit 1
          fi
          echo "PASS: No INTERNET permission in source."
